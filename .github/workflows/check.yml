name: Check NYC marriage slots

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch: {}       # "Run workflow" button for manual runs

concurrency:
  group: slot-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Remember which slots were already notified, so you get one alert per new slot
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: slot-state-${{ github.run_id }}
          restore-keys: slot-state-

      - name: Check
        env:
          TARGET_DATE: "2026-10-20"
          OFFICE: "Manhattan"
          MIN_TIME: "09:00"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python checker.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: slot-state-${{ github.run_id }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
