name: Watch NYC marriage slots

# One long job that checks every 5 minutes for ~5h40m, then restarts itself
# (GitHub's job limit is 6h). More reliable than GitHub's cron, which is often
# late or skips runs. The hourly cron only restarts the chain if it ever breaks.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

# Only one watcher at a time; an extra trigger just waits as "pending".
concurrency:
  group: slot-watcher
  cancel-in-progress: false

permissions:
  actions: write   # to restart itself
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Uses the runner's preinstalled Google Chrome: downloading Playwright's
      # browser + system packages sometimes takes 15+ minutes.
      - name: Install
        timeout-minutes: 5
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: slot-state-v2-${{ github.run_id }}
          restore-keys: slot-state-v2-

      - name: Check every 5 minutes
        env:
          TARGET_DATE: "2026-10-20"
          OFFICE: "Manhattan"
          MIN_TIME: "09:00"
          NOTIFY_EVERY_RUN: "1"     # alert on every check while a slot is open
          CHECK_INTERVAL_MIN: "5"
          MAX_RUNTIME_MIN: "340"
          TZ: America/New_York
          BROWSER_CHANNEL: chrome
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python checker.py --loop

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: slot-state-v2-${{ github.run_id }}

      - name: Restart watcher
        if: ${{ !cancelled() }}   # cancelling a run stops the chain (hourly cron restarts it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/New_York date +%F)" \< "2026-10-21" ]; then
            gh workflow run watch.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
          fi
